; bustaferl — PlatformIO project configuration
; Two environments:
;   esp32dev — target build for the actual ESP32 hardware
;   native   — host build for unit tests (no ESP32 code in the path)

[platformio]
default_envs = esp32dev
src_dir = src
test_dir = test

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Exclude test helpers from production build
build_src_filter =
    +<*>
    -<../test/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore = test_esp32_*
build_flags =
    ${env.build_flags}
    -DNATIVE_BUILD
    -DUNITY_INCLUDE_DOUBLE
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
; For host tests we only compile the platform-neutral parts:
; data/, logic/, render/rle. Everything else stays out.
build_src_filter =
    +<data/>
    +<logic/>
    +<render/rle.cpp>
    +<render/rle.h>

; On-device smoke test: WiFi connect -> HTTPS GET to live Wiener-Linien API
; -> JSON parse -> per-stream filter check. Runs via `make test-esp32` and
; reports pass/fail over serial (Unity protocol). Replaces the running
; firmware on /dev/ttyUSB0; re-flash with `make flash` afterwards.
[esp32_test_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
test_framework = unity
test_build_src = yes
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Exclude main.cpp — the test program supplies its own setup()/loop().
; Keep the rest of src/ so the test can link against Esp32Network /
; wienerlinien_parse etc.
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>

[env:esp32-test-fetch]
extends = esp32_test_base
test_filter = test_esp32_fetch

; RTC slow memory + RLE round-trip for Esp32PersistentStore. Cold-RTC checks
; must run before the production firmware has populated the magic word, so a
; fresh upload between fetch and persistent runs is expected.
[env:esp32-test-persistent]
extends = esp32_test_base
test_filter = test_esp32_persistent

; renderFrame() + error_overlay verification. No WiFi/HTTPS needed — pure
; framebuffer assertions, but Adafruit_GFX is ESP32-only so it can't live in
; env:native.
[env:esp32-test-render]
extends = esp32_test_base
test_filter = test_esp32_render

; Esp32Sleep wakeupCause mapping — cold boot + timer wake via light sleep
; (no chip reset, runs in a single Unity session).
[env:esp32-test-sleep]
extends = esp32_test_base
test_filter = test_esp32_sleep

; ~1 hour steady-state stress: 60 fetch+parse cycles at 60 s cadence, with
; heap-leak and success-rate guards. Test timeout bumped to 70 minutes so
; PIO does not kill the run before the assertions fire.
[env:esp32-test-longterm]
extends = esp32_test_base
test_filter = test_esp32_longterm
test_timeout = 4200
