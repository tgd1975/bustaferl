; bustaferl — PlatformIO project configuration
;
; Three test buckets (see test/README.md and docs/TESTING.md):
;   env:native            host-only unit tests, ~5 s, runs `test_native_*`
;   env:device-*          on-device ESP32 tests, run `test_device_*`
;   env:longterm-*        opt-in long-runners, run `test_longterm_*`
;
; The Makefile is the canonical entry point — see `make help`.

[platformio]
default_envs = esp32dev
src_dir = src
test_dir = test

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Exclude test helpers from production build
build_src_filter =
    +<*>
    -<../test/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Glob-based filter: anything not test_native_* stays out automatically.
; test_native_runtime/ holds the standalone driver binary (libcurl-linked,
; not a Unity test); excluded explicitly so PIO doesn't try to compile it
; as a test in env:native. The driver builds via `make native-runtime-build`.
test_ignore =
    test_device_*
    test_longterm_*
    test_native_runtime
; Plan §0c.3 + §0c.4: strict warnings + sanitizers, host-only.
;
; Scope choices (informed by the AwesomeStudioPedal sister project and
; this project's no-rabbithole policy — memory feedback-no-tooling-rabbit-holes):
;
; 1. ESP32 build (env / device_base / longterm_base) stays at -Wall -Wextra.
;    Hardening it would drown ArduinoJson / GxEPD2 / Arduino-framework
;    headers in warnings; same workaround ASP uses (see plan §4.1 [11]).
;
; 2. Strict warnings on src/+test/ TUs only, via build_src_flags. Library
;    headers (ArduinoJson, Unity) are marked -isystem in build_flags below.
;
; 3. The C++-only diagnostics (-Wold-style-cast, -Wnon-virtual-dtor,
;    -Woverloaded-virtual, -Wsuggest-override,
;    -Wzero-as-null-pointer-constant) are NOT in build_src_flags:
;    PIO 6.x generates a .c shim (unity_config.c) which build_src_flags
;    also touches; cc1 errors on C++-only options (with -Werror this
;    killed every native test env on CI's freshly installed PIO). The GCC-only
;    diagnostics (-Wduplicated-cond, -Wduplicated-branches, -Wlogical-op)
;    are out for an analogous reason: `make tidy` re-uses the build_flags
;    via compile_commands.json, and clang-tidy errors on the unknown
;    options. Selective routing would need a SCons flag-filter hook
;    (the rabbithole). These classes are already covered by clang-tidy
;    (cppcoreguidelines-pro-type-cstyle-cast, modernize-use-override,
;    cppcoreguidelines-pro-type-static-cast-downcast, bugprone-branch-clone).
;
; 4. -Wconversion / -Wsign-conversion are also out for the same reason:
;    the PIO-generated unity_config.c hits both on putchar(c). Trade-off
;    accepted; ASan/UBSan catch the runtime form of the same bug class,
;    and explicit narrowing casts on the few real src/ sites stay
;    enforced via clang-tidy.
;
; 5. Sanitizers (-fsanitize=address,undefined) go in build_flags so they
;    reach the link line for every TU including library code.
build_flags =
    ${env.build_flags}
    -DNATIVE_BUILD
    -DARDUINO=100
    -I src/host_compat
    -I src
    -isystem .pio/libdeps/native/ArduinoJson/src
    -isystem .pio/libdeps/native/Unity/src
    -isystem ".pio/libdeps/esp32dev/Adafruit GFX Library"
    -isystem .pio/libdeps/esp32dev/U8g2_for_Adafruit_GFX/src
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=all
build_src_flags =
    -Wpedantic
    -Werror
    -Wshadow
    -Wcast-align
    -Wcast-qual
    -Wunused
    -Wmisleading-indentation
    -Wnull-dereference
    -Wdouble-promotion
    -Wformat=2
    -Wundef
    -Winit-self
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    fabiobatsilva/ArduinoFake@^0.4.0
    AdafruitGfxMinimal
    U8g2ForAdafruitGfxMinimal
; Adafruit GFX + U8g2_for_Adafruit_GFX are NOT in lib_deps. We pull only the
; single .cpp we need from each (Adafruit_GFX.cpp + U8g2_for_Adafruit_GFX.cpp)
; via build_src_filter below — that keeps Adafruit_GrayOLED.cpp / SPITFT.cpp
; and the BusIO transitive dep out of the host build. Their .cpps drag in
; ESP32/AVR-specific symbols (BitOrder, _dataOrder) that ArduinoFake doesn't
; cover and that we'd otherwise have to stub.
;
; The Adafruit GFX + U8g2_for_Adafruit_GFX *headers* are still needed; we add
; their directories via -isystem in build_flags. The libs are downloaded into
; .pio/libdeps/esp32dev by the device builds, so the -isystem paths always
; exist after a fresh checkout's first device build. For first-time native
; builds, run `pio pkg install -e esp32dev` once to materialise them.
lib_compat_mode = off
; For host tests we compile data/, logic/, and the full render/ stack — now
; including AdafruitGfxCanvas, which can run on host via ArduinoFake. The
; HostCanvas wraps AdafruitGfxCanvas; both targets exercise the same Canvas
; backend so PGM dumps are pixel-identical to the device renders.
;
; Adafruit_GFX.cpp + U8g2_for_Adafruit_GFX.cpp arrive via private libs under
; lib/AdafruitGfxMinimal + lib/U8g2ForAdafruitGfxMinimal — those libs point
; back into .pio/libdeps/esp32dev so we never copy vendor code. Private libs
; are compiled with build_flags only (no strict-warnings via build_src_flags),
; which is correct: their warnings are not ours to fix.
build_src_filter =
    +<data/>
    +<logic/>
    +<render/>

; --- Native runtime driver (Refactor-Plan §9 — host soak loop) ---
;
; The standalone libcurl driver in test/test_native_runtime/ (own int main(),
; not a Unity test) that fetches the real Wiener-Linien endpoints and runs
; runColdCycle/runWarmCycle on the host. It builds as a normal PIO *program*
; env — NOT via a hand-maintained g++ source list in the Makefile. That list
; drifted silently once already (a render-layer split added files the g++
; recipe never picked up, and nothing in CI built this binary), so the driver
; now rides PlatformIO's own dependency resolution: the render/logic/data
; globs below are the single source of truth, identical to env:native's.
;
; Inherits env:native's GFX/U8g2/ArduinoFake wiring (headers via -isystem,
; the two minimal GFX .cpp libs, ArduinoFake as the Arduino shim), so the
; full render stack — including the boot-check/diag pages in layout.cpp —
; links on host exactly as the device build does.
[env:native-runtime]
extends = env:native
; Long soak binary, distinct build profile from the env:native unit tests:
;   * Drop ASan/UBSan — env:native forces them, but a 24 h run under the
;     sanitizers is needlessly heavy; the leak channel here is valgrind via
;     `make native-runtime-smoke`, which instruments the release binary.
;   * -O2 -g, UPDATE_STAMP off — matches the historical hand-rolled driver.
;   * -lcurl for HttpsNet. ArduinoJson's include path comes from lib_deps
;     automatically; only the GFX/U8g2 *headers* need explicit -isystem (they
;     are vendored under esp32dev by the device builds, exactly as env:native
;     references them).
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DNATIVE_BUILD
    -DARDUINO=100
    -DUPDATE_STAMP_ENABLED=0
    -O2
    -g
    -I src/host_compat
    -I src
    -isystem ".pio/libdeps/esp32dev/Adafruit GFX Library"
    -isystem .pio/libdeps/esp32dev/U8g2_for_Adafruit_GFX/src
    -lcurl
; env:native hardens src/ TUs with -Werror -Wpedantic -Wundef etc. That set is
; for the unit-test env; here it fires inside vendored library headers reached
; transitively (ArduinoFake's RAMEND/RAMSTART, ArduinoJson null-deref false
; positives) because ArduinoFake is a lib_deps, not -isystem. The driver's own
; correctness is covered by the env:native tests; this env just needs to build
; and run, so disarm the strict src-flag set.
build_src_flags =
; Swap the driver TUs in for src/main.cpp (the firmware entry). Same render/
; logic/ data/ globs as env:native — that is the point: one glob, no list.
build_src_filter =
    +<data/>
    +<logic/>
    +<render/>
    +<../test/test_native_runtime/main.cpp>
    +<../test/test_native_runtime/DiskStore.cpp>
    +<../test/test_native_runtime/HttpsNet.cpp>
    +<../test/test_native_runtime/RecordingRenderer.cpp>

; --- On-device base (device-*) ---
;
; Each device-Env extends this and sets `test_filter = test_device_<one>`.
; The glob-based ignore keeps native and longterm tests out.
[device_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
test_framework = unity
test_build_src = yes
test_ignore =
    test_native_*
    test_longterm_*
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DUNITY_SUPPORT_64
; Exclude main.cpp — the test program supplies its own setup()/loop().
; Keep the rest of src/ so the test can link against Esp32Network /
; wienerlinien_parse etc.
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>

[env:device-fetch]
extends = device_base
test_filter = test_device_fetch

; RTC slow memory + RLE round-trip for Esp32PersistentStore. Cold-RTC checks
; must run before the production firmware has populated the magic word, so a
; fresh upload between fetch and persistent runs is expected.
[env:device-persistent]
extends = device_base
test_filter = test_device_persistent

; renderFrame() + error_overlay verification. No WiFi/HTTPS needed — pure
; framebuffer assertions, but Adafruit_GFX is ESP32-only so it can't live in
; env:native today. (Phase 2 of the test-setup migration may move this to
; host once Adafruit_GFX is confirmed to build native.)
[env:device-render]
extends = device_base
test_filter = test_device_render

; Esp32Sleep wakeupCause mapping — cold boot + timer wake via light sleep
; (no chip reset, runs in a single Unity session).
[env:device-sleep]
extends = device_base
test_filter = test_device_sleep

; EFA schedule pipeline (CONCEPT.md §12). Runs the three back-to-back
; XSLT_DM_REQUEST calls that were OOM-aborting the device on cold boot.
; Logs free heap at every step; passes only if all three calls complete
; without crashing and at least one stream picks up a first_tomorrow hint.
[env:device-schedule]
extends = device_base
test_filter = test_device_schedule

; --- Long-term base (longterm-*) ---
;
; Same hardware build as device_base, but runs `test_longterm_*` only.
[longterm_base]
extends = device_base
test_ignore =
    test_native_*
    test_device_*

; NOTE on wall-clock timeouts: the plan §5 specifies `test_timeout = …` per
; env. PIO 6.1.19 does NOT recognize that option (silent in older docs,
; warned in newer releases). The plan was aspirational on this point; in
; this PIO version the per-cycle delays inside the test source are the
; only wall-clock control. Tests rely on PIO's default upload/test
; lifecycle timeout, which has historically tolerated the 1 h soak run.
; Long-term targets > 1 h (horizon-scan, horizon-evening, day-full) may
; need an alternative driver (CI runner or external watchdog) if PIO's
; default kills them. Leaving env definitions in place so the make
; targets resolve.

; Soak family: one source (test/test_longterm_soak/), three cycle-count
; variants via build-define. HEAP_LEAK_BUDGET_BYTES in the source scales
; linearly: (8 KB * LONGTERM_SOAK_CYCLES) / 60.
[env:longterm-soak-5min]
extends = longterm_base
test_filter = test_longterm_soak
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -DLONGTERM_SOAK_CYCLES=5

[env:longterm-soak-15min]
extends = longterm_base
test_filter = test_longterm_soak
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -DLONGTERM_SOAK_CYCLES=15

[env:longterm-soak-1h]
extends = longterm_base
test_filter = test_longterm_soak
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3 -DLONGTERM_SOAK_CYCLES=60

; ~3 min HW-sanity check after a fresh flash. End-to-end pipeline once,
; assert WiFi+HTTPS+parse+render don't crash on real hardware.
[env:longterm-smoke]
extends = longterm_base
test_filter = test_longterm_smoke

; ~10 min retry/reconnect under injected WiFi drops.
[env:longterm-jitter]
extends = longterm_base
test_filter = test_longterm_jitter

; ~30 min real deep-sleep + persistent store across cycles.
[env:longterm-wake]
extends = longterm_base
test_filter = test_longterm_wake_cycle

; ~90 min rolling-window cliff during full data availability.
[env:longterm-horizon-scan]
extends = longterm_base
test_filter = test_longterm_horizon_scan

; ~5 h evening dry-up + sleep into night silence (start ~21:30).
[env:longterm-horizon-evening]
extends = longterm_base
test_filter = test_longterm_horizon_evening

; ~24 h pre-release unattended overnight (start in the evening).
[env:longterm-day-full]
extends = longterm_base
test_filter = test_longterm_day_full

; Firmware-only env for the horizon-mock runner (test §9). NOT a test
; env — the orchestrator lives in test/test_longterm_horizon_mock/runner.py
; and asserts on the serial log. The firmware setup()/loop() are
; supplied by test/test_longterm_horizon_mock/test_main.cpp, so we have
; to swap in that file in place of src/main.cpp. MOCK_API_BASE and
; MOCK_INSECURE are injected by the runner via PLATFORMIO_BUILD_FLAGS.
[env:longterm-horizon-mock-firmware]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../test/test_longterm_horizon_mock/test_main.cpp>

; --- Mock-view firmwares (mockview-*) ---
;
; Seven single-state firmwares for Session E HW visual inspection
; (docs/v2-sbahn-migration-plan.md §11). Each flashes a different DisplayState
; with hard-coded mock data and deep-sleeps. Shared: runMockView() +
; mock_data.cpp. Per env: exactly one main_<n>_*.cpp picked via src_filter.
; Flash with `pio run -e mockview-1-normal -t upload` (or `make mockview-1`).
[mockview_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.0.4
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=3

[env:mockview-1-normal]
extends = mockview_base
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../tools/mockview/mockview_runner.cpp>
    +<../tools/mockview/mock_data.cpp>
    +<../tools/mockview/main_1_normal.cpp>

[env:mockview-5-kein-empfang]
extends = mockview_base
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../tools/mockview/mockview_runner.cpp>
    +<../tools/mockview/mock_data.cpp>
    +<../tools/mockview/main_5_kein_empfang.cpp>

[env:mockview-6-auth-fehler]
extends = mockview_base
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../tools/mockview/mockview_runner.cpp>
    +<../tools/mockview/mock_data.cpp>
    +<../tools/mockview/main_6_auth_fehler.cpp>

[env:mockview-7-boot]
extends = mockview_base
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../tools/mockview/mockview_runner.cpp>
    +<../tools/mockview/mock_data.cpp>
    +<../tools/mockview/main_7_boot.cpp>

; Diagnostic geometry probe — bypasses renderFrame, draws fixed test
; patterns directly. Used to isolate render-vs-HAL drift during §11.
; No mockview_runner — main_8_geometry.cpp inlines its own minimal setup.
[env:mockview-8-geometry]
extends = mockview_base
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
    +<../tools/mockview/main_8_geometry.cpp>
