; bustaferl — PlatformIO project configuration
; Two environments:
;   esp32dev — target build for the actual ESP32 hardware
;   native   — host build for unit tests (no ESP32 code in the path)

[platformio]
default_envs = esp32dev
src_dir = src
test_dir = test

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Exclude test helpers from production build
build_src_filter =
    +<*>
    -<../test/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore = test_esp32_*
build_flags =
    ${env.build_flags}
    -DNATIVE_BUILD
    -DUNITY_INCLUDE_DOUBLE
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
; For host tests we only compile the platform-neutral parts:
; data/, logic/, render/rle. Everything else stays out.
build_src_filter =
    +<data/>
    +<logic/>
    +<render/rle.cpp>
    +<render/rle.h>

; On-device smoke test: WiFi connect -> HTTPS GET to live Wiener-Linien API
; -> JSON parse -> per-stream filter check. Runs via `make test-esp32` and
; reports pass/fail over serial (Unity protocol). Replaces the running
; firmware on /dev/ttyUSB0; re-flash with `make flash` afterwards.
[env:esp32-test-fetch]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
test_framework = unity
test_build_src = yes
test_filter = test_esp32_fetch
lib_deps =
    zinggjm/GxEPD2@^1.5.6
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Exclude main.cpp — the test program supplies its own setup()/loop().
; Keep the rest of src/ so the test can link against Esp32Network /
; wienerlinien_parse etc.
build_src_filter =
    +<*>
    -<main.cpp>
    -<../test/>
