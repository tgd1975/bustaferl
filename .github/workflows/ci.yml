name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Install clang-format + clang-tidy (pinned to 21)
        # Pin the whole LLVM toolchain to 21 so CI matches the developers'
        # local clang-format/clang-tidy. Two skews motivated this:
        #   * clang-format 21 changed struct-brace-init spacing
        #     ("struct tm x {}" -> "x{}"); older CI binaries failed
        #     format-check on files `make format` had already fixed.
        #   * make ci also runs `tidy`; it must use a matching clang-tidy 21
        #     with the vendored-lib include paths (see the tidy target).
        # Install via the official LLVM apt source (versioned packages aren't
        # on ubuntu-latest yet), then symlink the unversioned names so the
        # Makefile targets pick them up.
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y clang-format-21 clang-tidy-21
          sudo ln -sf "$(command -v clang-format-21)" /usr/local/bin/clang-format
          sudo ln -sf "$(command -v clang-tidy-21)" /usr/local/bin/clang-tidy
          clang-format --version
          clang-tidy --version
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Provide dummy secrets.h
        run: cp secrets.h.example src/secrets.h
      - name: CI (format-check + lint + test-native + build)
        run: make ci
