name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Install clang-format
        # Pin to clang-format 21 to match the developers' local toolchain.
        # ubuntu-latest's default `clang-format` is an older major whose
        # brace-init spacing rule ("struct tm x {}" vs "x{}") disagrees with
        # v21, which made format-check fail on files that `make format` had
        # already formatted correctly locally. Try the versioned apt package
        # first; fall back to the official LLVM apt source if the runner image
        # doesn't carry clang-format-21 yet. Symlink to `clang-format` so
        # `make format-check` picks it up.
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y clang-format-21; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
            sudo apt-get install -y clang-format-21
          fi
          sudo ln -sf "$(command -v clang-format-21)" /usr/local/bin/clang-format
          clang-format --version
      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck
      - name: Provide dummy secrets.h
        run: cp secrets.h.example src/secrets.h
      - name: CI (format-check + lint + test-native + build)
        run: make ci
